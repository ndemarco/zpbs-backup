name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install .[dev]
      - run: pytest

  build-wheel:
    runs-on: ubuntu-latest
    needs: test
    name: Build wheel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  build-packages:
    runs-on: ubuntu-latest
    needs: build-wheel
    name: Build packages
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
      - run: pip install build
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/
      - run: bash packaging/build-packages.sh
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm

  upload-release:
    runs-on: ubuntu-latest
    needs:
      - build-wheel
      - build-packages
    name: Upload to release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist/
      - run: ls -lh dist/
      - name: Create or upload release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
          gh release upload "${{ github.ref_name }}" \
            dist/*.whl dist/*.deb dist/*.rpm \
            --clobber

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-wheel
    name: Publish to PyPI
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheel
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/
      - run: ls -lh dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
