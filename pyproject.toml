[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zpbs-backup"
dynamic = ["version"]
description = "ZFS property-driven Proxmox Backup Server backup tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nick DeMarco", email = "nick@demarcohome.com" }
]
keywords = ["zfs", "proxmox", "backup", "pbs", "proxmox-backup-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
    "ruff",
    "mypy",
]

[project.scripts]
zpbs-backup = "zpbs_backup.cli:main"

[project.urls]
Homepage = "https://github.com/ndemarco/zpbs-backup"
Documentation = "https://github.com/ndemarco/zpbs-backup#readme"
Repository = "https://github.com/ndemarco/zpbs-backup"
Issues = "https://github.com/ndemarco/zpbs-backup/issues"
Changelog = "https://github.com/ndemarco/zpbs-backup/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/zpbs_backup/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zpbs_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
strict = true

# The test suite is deliberately unannotated: a pytest function's signature
# carries no information a reader or the checker needs. Real type errors in
# tests are still reported; only the "annotate everything" rules are off.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

# cli is a leaf module: nothing imports from it but the console-script entry
# point and the tests, which patch a collaborator where cli looks it up
# (cli.PBSClient) — the one correct place to patch it. Re-export hygiene buys
# nothing here and would force the tests to patch the wrong module.
[[tool.mypy.overrides]]
module = "zpbs_backup.cli"
implicit_reexport = true
